<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Interactive Project</h1>

    <!-- Event Handling -->
    <button id="magicBtn">Click me!</button>
    <div class="hover-box" style="width: 100px; height: 100px; border: 1px solid black;">Hover over me</div>
    <input type="text" id="keyInput" placeholder="Type something…">

    <!-- Interactive Elements -->
    <div class="tabs">
        <button class="tab active">Tab 1</button>
        <button class="tab">Tab 2</button>
    </div>
    <div class="tab-content" style="display: block;">Content for Tab 1</div>
    <div class="tab-content" style="display: none;">Content for Tab 2</div>

    <!-- Form Validation -->
    <form>
        <input type="email" id="email" placeholder="Enter your email" required>
        <input type="password" id="password" placeholder="Enter your password" required>
        <span id="passwordFeedback"></span>
        <button type="submit">Submit</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
